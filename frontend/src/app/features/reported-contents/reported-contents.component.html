<h1>Kiểm duyệt nội dung</h1>

<table mat-table [dataSource]="rows()" class="mat-elevation-z1 w-full">
  <ng-container matColumnDef="reportableType">
    <th mat-header-cell *matHeaderCellDef>Loại</th>
    <td mat-cell *matCellDef="let row">{{ row.reportableType }}</td>
  </ng-container>

  <ng-container matColumnDef="reportableId">
    <th mat-header-cell *matHeaderCellDef>ID nội dung</th>
    <td mat-cell *matCellDef="let row">{{ row.reportableId }}</td>
  </ng-container>

  <ng-container matColumnDef="reason">
    <th mat-header-cell *matHeaderCellDef>Lý do</th>
    <td mat-cell *matCellDef="let row">{{ row.reason }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Trạng thái</th>
    <td mat-cell *matCellDef="let row">
      <p-select
        [options]="['pending', 'reviewed', 'dismissed']"
        [ngModel]="row.status.toLowerCase()"
        (ngModelChange)="updateStatus(row, $event)"
        styleClass="!min-w-[130px]" />
    </td>
  </ng-container>

  <ng-container matColumnDef="createdAt">
    <th mat-header-cell *matHeaderCellDef>Ngày báo cáo</th>
    <td mat-cell *matCellDef="let row">{{ row.createdAt | date: 'short' }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Hành động</th>
    <td mat-cell *matCellDef="let row">
      <button mat-stroked-button color="warn" (click)="removeContent(row)">Gỡ nội dung</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

@if (meta(); as m) {
  <mat-paginator
    [length]="m.total"
    [pageSize]="m.limit"
    [pageIndex]="m.page - 1"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="onPage($event)">
  </mat-paginator>
}
