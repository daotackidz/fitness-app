@if (items.length === 0) {
  <p class="chart-empty">{{ emptyLabel }}</p>
} @else {
  <div class="bar-chart">
    @for (item of items; track item.label) {
      <div class="bar-row" [title]="item.label + ': ' + formatValue(item.value)">
        <span class="bar-label">{{ item.label }}</span>
        <span class="bar-track">
          <span class="bar-fill" [style.width.%]="widthPercent(item.value)" [style.background]="item.color"></span>
        </span>
        <span class="bar-value">{{ formatValue(item.value) }}</span>
      </div>
    }
  </div>
}
